version: 2

updates:
  # npm dependencies
  - package-ecosystem: 'npm'
    directories:
      - /js/vms
      - /js/ui
      - /js/grafana
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'America/New_York'
    open-pull-requests-limit: 10
    labels:
      - 'dependencies'
      - 'automated'
    groups:
      # Group minor and patch updates together
      dev-dependencies:
        dependency-type: 'development'
        update-types:
          - 'major'
          - 'minor'
          - 'patch'
      production-dependencies:
        update-types:
          - 'minor'
          - 'patch'

  # GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'America/New_York'
    # Group all actions updates into a single PR.
    groups:
      actions:
        patterns:
          - '*'
