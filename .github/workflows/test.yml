name: 'build-test'
on:
  pull_request:
    paths-ignore:
      - '**.md'
  push:
    branches:
      - master
    paths-ignore:
      - '**.md'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm install
      - run: npm run all
      - name: Verify dist does not need to be rebuilt
        run: git add dist && git diff-index --quiet --cached HEAD --

